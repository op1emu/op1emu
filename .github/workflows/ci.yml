name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: python3 -m pytest tools/tests -q

  libcxx:
    # libc++'s system_clock counts microseconds, not libstdc++'s nanoseconds;
    # guest time converts to it (TimeSource::SystemNow, DueNs).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-15 libc++-15-dev libc++abi-15-dev
      - name: TimeSource test with libc++
        run: |
          clang++-15 -std=c++17 -stdlib=libc++ -Wall -Wextra -Werror -I src \
            -o time-source-test tests/time_source_test.cpp
          ./time-source-test

  build-test:
    name: build-test (profiling=${{ matrix.profiling }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profiling: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15 llvm-15-dev cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.profiling }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.profiling }}-

      - name: Configure
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
        run: |
          ccache --zero-stats
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DOP1_BUILD_HEADLESS_TESTS=ON \
            -DENABLE_PROFILING=${{ matrix.profiling }}

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --build build --target op1emu ldrdump op1-headless-test op1-time-source-test op1-realtime-pacer-test op1-nfc-ecc-test op1-rtc-interrupt-test op1-device-service-test op1-gptimer-test op1-cpu-events-test op1-cpu-chain-test op1-data-fault-test op1-audio-ring-test op1-audio-pcm-test op1-direct-pages-test op1-register-test \
            ${{ matrix.profiling == 'ON' && 'op1-mark-set-test op1-service-stats-test' || '' }}
          ccache --show-stats

      - name: Test (synthetic inputs only, no NAND or firmware)
        # The -R filter keeps out bcore's comparison_test, which is registered
        # whenever a bfin toolchain is on PATH.
        run: ctest --test-dir build -R "nfc-ecc-test|rtc-interrupt-test|device-service-test|gptimer-test|cpu-events-test|cpu-chain-test|headless-test|time-source-test|realtime-pacer-test|data-fault-test|audio-ring-test|audio-pcm-test|direct-pages-test|register-test|ldr-smoke|mark-set-test|service-stats-test|profile-smoke" --output-on-failure

      - name: CLI sanity
        run: ./build/op1emu --help
