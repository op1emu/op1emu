name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: python3 -m pytest tools/tests -q

  build-test:
    name: build-test (profiling=${{ matrix.profiling }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profiling: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15 llvm-15-dev cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.profiling }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.profiling }}-

      - name: Configure
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
        run: |
          ccache --zero-stats
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DOP1_BUILD_HEADLESS_TESTS=ON \
            -DENABLE_PROFILING=${{ matrix.profiling }}

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --build build --target op1emu ldrdump op1-headless-test op1-time-source-test
          ccache --show-stats

      - name: Test (synthetic inputs only, no NAND or firmware)
        # The -R filter keeps out bcore's comparison_test, which is registered
        # whenever a bfin toolchain is on PATH.
        run: ctest --test-dir build -R "headless-test|time-source-test|ldr-smoke" --output-on-failure

      - name: CLI sanity
        run: ./build/op1emu --help
