name: CI

# Pull requests run once (as pull_request), main once per push; a newer push
# to a pull request cancels the run still going. Each push to main is a
# group of its own: in one group a third push would cancel the second's run
# while it waited.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: python3 -m pytest tools/tests -q

  libcxx:
    # libc++'s system_clock counts microseconds, not libstdc++'s nanoseconds;
    # guest time converts to it (TimeSource::SystemNow, DueNs).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-15 libc++-15-dev libc++abi-15-dev
      - name: TimeSource test with libc++
        run: |
          clang++-15 -std=c++17 -stdlib=libc++ -Wall -Wextra -Werror -I src \
            -o time-source-test tests/time_source_test.cpp
          ./time-source-test

  build-test:
    name: build-test (profiling=${{ matrix.profiling }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profiling: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-15 llvm-15-dev cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.profiling }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.profiling }}-

      - name: Configure
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
        run: |
          ccache --zero-stats
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DOP1_BUILD_HEADLESS_TESTS=ON \
            -DOP1_BUILD_DMA_TESTS=ON \
            -DENABLE_PROFILING=${{ matrix.profiling }}

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --build build
          ccache --show-stats

      # Every test the build registers (bcore's own are not: they run in
      # bcore's CI). None needs a NAND image or firmware.
      - name: Test (synthetic inputs only, no NAND or firmware)
        run: ctest --test-dir build -j$(nproc) --output-on-failure

      - name: CLI sanity
        run: ./build/op1emu --help
